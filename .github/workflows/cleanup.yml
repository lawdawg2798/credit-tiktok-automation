name: Cleanup Pending

permissions:
  contents: write

on:
  workflow_dispatch: {}   # manual only — run from the Actions tab whenever

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Archive finished videos
        run: python cleanup.py
      - name: Commit archive move
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content_pending content_posted 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: archive finished videos [skip ci]"
          git push
