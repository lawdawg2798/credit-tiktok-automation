name: Daily TikTok Post

on:
  schedule:
    # Runs once a day at 14:15 UTC (~9:15am America/Chicago); add a second
    # cron line here if you want the 2nd daily slot from variation.yaml.
    - cron: "15 14 * * *"
  workflow_dispatch: {}   # lets you trigger manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post next ready video
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python scripts/post_to_tiktok.py

      - name: Commit updated content state
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content/
          git diff --cached --quiet || git commit -m "chore: mark video as posted [skip ci]"
          git push
