name: Weekly Content Batch

on:
  schedule:
    - cron: "0 15 * * 0"   # Sundays 15:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to generate this run"
        default: "7"

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_script.py --count ${{ github.event.inputs.count || 7 }}

      - name: Generate voiceovers
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/tts.py

      - name: Assemble videos
        env:
          CREATOMATE_API_KEY: ${{ secrets.CREATOMATE_API_KEY }}
        run: python scripts/assemble.py

      - name: Commit new pending content
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content/ config/recent_history.json
          git diff --cached --quiet || git commit -m "chore: weekly content batch [skip ci]"
          git push
